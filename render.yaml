services:
  - type: web
    name: equity-research-agent-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_API_KEY
        sync: false  # set this in Render dashboard
      - key: PYTHON_VERSION
        value: "3.11.9"
    plan: free
